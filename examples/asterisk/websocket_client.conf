; Merge into /etc/asterisk/websocket_client.conf; mode 0600, PBX service owner.
; Replace hostname and password locally. Never commit the populated file.
[openfon]
type = websocket_client
connection_type = per_call_config
uri = wss://YOUR-OPENFON-HOST/ws/asterisk/pbx
protocols = media
username = pbx
password = REPLACE_WITH_RANDOM_PASSWORD_AT_LEAST_32_BYTES
tls_enabled = yes
verify_server_cert = yes
verify_server_hostname = yes
connection_timeout = 10000
reconnect_attempts = 0
enable_pingpongs = yes
pingpong_interval = 5
pingpong_probes = 2
