; Include from the inbound context of your existing authenticated SIP trunk.
; Do not expose this as an unauthenticated public outbound dialplan.
[openfon-inbound]
exten => s,1,NoOp(OpenFon inbound assistant)
 same => n,Set(TIMEOUT(absolute)=1800)
 ; Call id is PBX-generated, not caller ID. Add a unique PBX prefix when sharing a route.
 same => n,Dial(WebSocket/openfon/c(ulaw)nf(json)v(call=${URIENCODE(${UNIQUEID})}),30)
 ; The websocket is the voice leg: disconnect/HANGUP ends Dial and this inbound call.
 same => n,Hangup()

; Local CLI smoke entry: channel originate Local/s@openfon-inbound application Echo
; This tests your PBX/media/provider path, not an external SIP/PSTN carrier.
