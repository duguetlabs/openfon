# Include at top level of nginx.conf, outside the http {} block.
stream {
  map $ssl_preread_server_name $openfon_tls_upstream {
    turn.openfon.ai 127.0.0.1:5349;
    turn-staging.openfon.ai 127.0.0.1:5350;
    default 127.0.0.1:8443;
  }
  server {
    listen 443;
    ssl_preread on;
    proxy_pass $openfon_tls_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
    access_log off;
    error_log /dev/null;
  }
}
