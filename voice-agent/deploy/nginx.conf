# Install as /etc/nginx/sites-available/openfon-voice, after certificate issuance.
# Before issuance, serve the port-80 block alone. Never expose LiveKit HTTP ports
# directly through Azure NSG; only TLS is public.
server {
  listen 80;
  server_name voice.openfon.ai voice-staging.openfon.ai turn.openfon.ai turn-staging.openfon.ai;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 127.0.0.1:8443 ssl proxy_protocol;
  set_real_ip_from 127.0.0.1;
  real_ip_header proxy_protocol;
  server_name voice.openfon.ai;
  ssl_certificate /etc/letsencrypt/live/openfon-voice/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openfon-voice/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  access_log off;
  error_log /dev/null;
  location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
server {
  listen 127.0.0.1:8443 ssl proxy_protocol;
  set_real_ip_from 127.0.0.1;
  real_ip_header proxy_protocol;
  server_name voice-staging.openfon.ai;
  ssl_certificate /etc/letsencrypt/live/openfon-voice/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openfon-voice/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  access_log off;
  error_log /dev/null;
  location / {
    proxy_pass http://127.0.0.1:7890;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
