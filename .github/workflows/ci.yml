name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Deploys on push to main when a Cloudflare API token is configured.
  # Create one at dash.cloudflare.com -> My Profile -> API Tokens ("Edit Cloudflare
  # Workers" template) and save it as the CLOUDFLARE_API_TOKEN repo secret.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run deploy` applies D1 migrations before uploading the worker.
      # The worker queries columns and tables the migrations create, so shipping
      # it against an unmigrated database takes every route that touches them
      # down. Migrations here are additive, so the running worker keeps serving
      # while they apply.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy."
            exit 0
          fi
          npm run deploy
