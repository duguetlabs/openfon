name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Deploys on push to main when a Cloudflare API token is configured.
  # Create one at dash.cloudflare.com -> My Profile -> API Tokens, as a **Custom
  # Token** with both of these permissions, and save it as the
  # CLOUDFLARE_API_TOKEN repo secret:
  #
  #   Account | Workers Scripts | Edit
  #   Account | D1              | Edit
  #
  # The "Edit Cloudflare Workers" template does NOT grant D1 Edit, and `npm run
  # deploy` applies pending D1 migrations before uploading the worker — a
  # template token fails authorization before anything ships.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run deploy` applies D1 migrations before uploading the worker.
      # The worker queries columns and tables the migrations create, so shipping
      # it against an unmigrated database takes every route that touches them
      # down. Migrations here are additive, so the running worker keeps serving
      # while they apply.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy."
            exit 0
          fi
          if ! npm run deploy; then
            echo "::error::Deploy failed. Note it now applies D1 migrations before uploading: CLOUDFLARE_API_TOKEN needs 'D1: Edit' as well as 'Workers Scripts: Edit'. Cloudflare's 'Edit Cloudflare Workers' template does not include D1 — use a Custom Token."
            exit 1
          fi
