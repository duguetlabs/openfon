name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy after reviewed release, backup and staging acceptance
        type: boolean
        required: true
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test docs/launch/demo/capture-sequence.test.mjs
      - run: npm run build
      - name: Synthetic carrier and realtime runtime checks
        env:
          OPENFON_TEST_PORT: '8814'
          OPENFON_INSPECTOR_PORT: '9254'
        run: |
          npm run test:telnyx
          node test/telnyx-retirement-smoke.mjs
          node test/asterisk-retirement-smoke.mjs
          node test/asterisk-playback-smoke.mjs
          node scripts/asterisk-smoke.mjs
          node scripts/realtime-smoke.mjs
          node scripts/realtime-smoke.mjs --gateway
      - run: python3 -O scripts/migration-rehearsal.py . --through 24

  # The benchmark scoring code is Python and computes the numbers in
  # docs/research/. A wrong normaliser or a slot matcher that fails closed would
  # move every figure in the report without failing anything, so it is pinned.
  # Separate job: these deps are irrelevant to the Worker build.
  bench-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Scoring only. If this list ever needs `websockets`, something in the
      # scoring path has picked up a transport import — see
      # TestScoringImportsAreTransportFree.
      - run: pip install jiwer num2words
      - run: python -m unittest discover -s bench/quality -p 'test_*.py' -v

  # The latency reports quote figures computed by bench/realtime/analyze.py from
  # the runs committed in bench/realtime/published/. Six review rounds found rows that
  # had drifted from the analyzer, so the reports are re-derived here rather than
  # trusted. The checker is stdlib-only and needs no credential and no network;
  # `websockets` is only for the harness modules the tests import.
  bench-realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'websockets>=14,<18'
      - run: python -m unittest discover -s bench/realtime -p 'test_*.py' -v
      # Also on its own, from a clean checkout: the documented command has to
      # work for a reader, and it only proves that when nothing else is set up.
      - run: python bench/realtime/check_report_tables.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7

  # Production deploy is an explicit dispatch on main after release acceptance.
  # Merging reviewed code alone must not apply production migrations. Two repo
  # secrets, and both are needed:
  #
  #   CLOUDFLARE_API_TOKEN   dash.cloudflare.com -> My Profile -> API Tokens,
  #                          as a **Custom Token** with:
  #                              Account | Workers Scripts | Edit
  #                              Account | D1              | Edit
  #   CLOUDFLARE_ACCOUNT_ID  dash.cloudflare.com -> Workers & Pages, in the
  #                          right-hand sidebar
  #
  # Two traps, both of which fail before anything ships:
  #
  # The "Edit Cloudflare Workers" template does NOT grant D1 Edit, and `npm run
  # deploy` applies pending D1 migrations before uploading the worker.
  #
  # And a runner has no cached account, so without CLOUDFLARE_ACCOUNT_ID wrangler
  # tries to discover one by listing /accounts — which the two permissions above
  # do not allow, and which cannot pick between accounts non-interactively
  # anyway. Supplying the id is the fix rather than widening the token: it needs
  # no extra permission and no guessing. (Adding `Account Settings: Read` also
  # works, but grants more and still fails if the token can see more than one
  # account.)
  deploy:
    needs: [check, bench-scoring, bench-realtime, browser]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run deploy` applies D1 migrations before uploading the worker.
      # The worker queries columns and tables the migrations create, so shipping
      # it against an unmigrated database takes every route that touches them
      # down. Some migrations revoke obsolete credentials or scrub snapshots;
      # they are not all additive. The 0016 compatibility barrier refuses an
      # inconsistent legacy/provider pair and blocks unsafe old-worker writes
      # after scrubbing. See docs/migration-compatibility.md before dispatch.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENFON_PUBLIC_URL: ${{ vars.OPENFON_PUBLIC_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. This explicit production deployment cannot proceed."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. A runner has no cached account, so wrangler would try to list /accounts to find one — which this token's permissions do not allow. Add the id from dash.cloudflare.com -> Workers & Pages (right-hand sidebar) as a repo secret."
            exit 1
          fi
          if [ -z "$OPENFON_PUBLIC_URL" ]; then
            echo "::error::OPENFON_PUBLIC_URL must be set to the production HTTPS origin."
            exit 1
          fi
          if ! npm run deploy; then
            echo "::error::Deploy failed. It applies D1 migrations before uploading, so CLOUDFLARE_API_TOKEN needs 'D1: Edit' as well as 'Workers Scripts: Edit'. Cloudflare's 'Edit Cloudflare Workers' template does not include D1 — use a Custom Token."
            exit 1
          fi
